# Railway — Railpack (substitui Nixpacks, deprecado)
# Docs: https://docs.railway.com/builds/railpack

[build]
builder = "RAILPACK"

[deploy]
# main:app = ASGI wrapper com lifespan → bootstrap_database() + pyweber
# PORT e injectado pelo Railway
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
