<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base de projectos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <div class="boot-loading loader-block">
      <div class="spinner"></div>
      <p>A preparar o portal...</p>
    </div>
    <div id="app-content" hidden>
      <section class="panel fade-in">
        <div class="panel-head">
          <h3><i class="bi bi-folder2-open"></i> Projectos / Pilares</h3>
          <p class="panel-hint">Dados mestre (objectivos, plano, orcamento, riscos) — cadastrados pela administracao.</p>
        </div>
        <div id="projectos-controls"></div>
        <div id="projectos-list" class="project-list">
          <div class="no-data compact"><i class="bi bi-hourglass-split"></i><p>A carregar...</p></div>
        </div>
      </section>
      <section class="panel fade-in delay-1" id="projecto-detail" hidden></section>
    </div>
  </div>
  <script type="module" src="/js/pages/projectos.js"></script>
</body>
</html>
