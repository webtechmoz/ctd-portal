<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anexos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <div class="boot-loading loader-block">
      <div class="spinner"></div>
      <p>A preparar o portal...</p>
    </div>
    <div id="app-content" hidden>
      <section class="home-hero fade-in">
        <div>
          <h2>Anexos</h2>
          <p>Todos os ficheiros carregados no portal, com referencia a origem.</p>
        </div>
        <a class="btn btn-outline" href="/avaliacao"><i class="bi bi-clipboard2-check"></i> Nova avaliacao</a>
      </section>

      <section class="panel fade-in delay-1">
        <div class="panel-head">
          <h3><i class="bi bi-folder2"></i> Ficheiros</h3>
        </div>
        <div id="anexos-controls"></div>
        <div id="anexos-list" class="arquivo-list">
          <div class="no-data compact"><i class="bi bi-hourglass-split"></i><p>A carregar...</p></div>
        </div>
      </section>
    </div>
  </div>
  <script type="module" src="/js/pages/anexos.js"></script>
</body>
</html>
