<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administracao</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div id="app">
    <div class="boot-loading loader-block">
      <div class="spinner"></div>
      <p>A preparar o portal...</p>
    </div>
    <div id="app-content" hidden>
      <div class="admin-toolbar">
        <button type="button" class="opts-btn" id="btn-opts" aria-label="Opcoes">
          <i class="bi bi-three-dots-vertical"></i>
        </button>
        <div class="opts-menu" id="opts-menu">
          <button type="button" data-panel="users" class="active"><i class="bi bi-people"></i> Utilizadores</button>
          <button type="button" data-panel="roles"><i class="bi bi-shield-lock"></i> Perfis e permissoes</button>
          <button type="button" data-panel="projectos"><i class="bi bi-folder2"></i> Config. projectos</button>
          <button type="button" data-panel="catalog"><i class="bi bi-list-check"></i> Listas de sistema</button>
        </div>
      </div>

      <section class="panel fade-in" id="panel-users">
        <div class="panel-head">
          <h3><i class="bi bi-people"></i> Utilizadores</h3>
          <button type="button" class="btn btn-primary compact" id="btn-new-user"><i class="bi bi-plus-lg"></i> Novo</button>
        </div>
        <div id="users-controls"></div>
        <div id="users-list"></div>
      </section>

      <section class="panel fade-in" id="panel-roles" hidden>
        <div class="panel-head">
          <h3><i class="bi bi-shield-lock"></i> Perfis</h3>
          <button type="button" class="btn btn-primary compact" id="btn-new-role"><i class="bi bi-plus-lg"></i> Novo perfil</button>
        </div>
        <div id="roles-controls"></div>
        <div id="roles-list"></div>
      </section>

      <section class="panel fade-in" id="panel-projectos" hidden>
        <div class="panel-head">
          <h3><i class="bi bi-folder2"></i> Projectos</h3>
          <a class="btn btn-primary compact" id="btn-new-pilar" href="/admin/projectos/novo"><i class="bi bi-plus-lg"></i> Novo projecto</a>
        </div>
        <div id="pilares-controls"></div>
        <div id="admin-pilares"></div>
      </section>

      <section class="panel fade-in" id="panel-catalog" hidden>
        <div class="panel-head">
          <h3><i class="bi bi-list-check"></i> Listas de sistema</h3>
        </div>
        <p class="panel-hint">Moedas, fases, areas e fontes — usadas nos formularios. So pode remover se nao estiver associada a projectos.</p>
        <div id="catalog-root"></div>
      </section>
    </div>
  </div>

  <!-- User modal -->
  <div class="modal-backdrop" id="modal-user" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="user-modal-title">Novo utilizador</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="user-form">
        <input type="hidden" id="u_edit_id" value="" />
        <div class="modal-body">
          <div class="field-grid">
            <label class="field"><span>Nome</span><input id="u_name" required /></label>
            <label class="field"><span>Email</span><input id="u_email" type="email" required /></label>
            <label class="field" id="u_password_field"><span id="u_password_label">Password</span><input id="u_password" type="password" minlength="8" /></label>
            <label class="field"><span>Perfil</span><select id="u_role_id" required></select></label>
            <label class="field" id="u_status_field" hidden><span>Estado</span>
              <select id="u_status">
                <option value="active">active</option>
                <option value="inactive">inactive</option>
              </select>
            </label>
          </div>
          <p class="panel-hint" id="user-perm-hint" hidden style="margin-top:12px"></p>
        </div>
        <div class="modal-foot modal-foot-split">
          <div class="modal-foot-danger">
            <button type="button" class="btn btn-outline compact" id="btn-edit-user-perms" hidden>
              <i class="bi bi-shield-lock"></i> Editar permissoes do perfil
            </button>
          </div>
          <div class="modal-foot-main">
            <button type="submit" class="btn btn-primary compact" id="btn-save-user">Criar</button>
            <button type="button" class="btn btn-outline compact" data-close-modal>Cancelar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Role modal -->
  <div class="modal-backdrop" id="modal-role" hidden>
    <div class="modal-card wide" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h3 id="role-modal-title">Novo perfil</h3>
        <button type="button" class="modal-close" data-close-modal aria-label="Fechar"><i class="bi bi-x-lg"></i></button>
      </div>
      <form id="role-form">
        <div class="modal-body">
          <div class="field-grid">
            <label class="field"><span>Nome</span><input id="r_name" required /></label>
            <label class="field"><span>Slug</span><input id="r_slug" required pattern="[a-z0-9_\\-]+" placeholder="ex: coordenador" /></label>
            <label class="field full"><span>Descricao</span><textarea id="r_desc" rows="2"></textarea></label>
          </div>
          <div id="perm-editor" class="perm-groups" style="margin-top:14px"></div>
        </div>
        <div class="modal-foot">
          <button type="submit" class="btn btn-primary compact">Guardar perfil</button>
          <button type="button" class="btn btn-outline compact" data-close-modal>Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-catalog-item" hidden>
    <div class="modal-card" role="dialog">
      <div class="modal-head">
        <h3 id="catalog-item-title">Nova opcao</h3>
        <button type="button" class="modal-close" data-close-modal><i class="bi bi-x-lg"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="cat_category" />
        <input type="hidden" id="cat_edit_id" value="" />
        <div class="field-grid">
          <label class="field"><span>Codigo</span><input id="cat_code" placeholder="ex: MZN" /></label>
          <label class="field"><span>Etiqueta</span><input id="cat_label" placeholder="Nome visivel" /></label>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-primary compact" id="btn-confirm-catalog">Guardar</button>
        <button type="button" class="btn btn-outline compact" data-close-modal>Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/js/pages/admin.js"></script>
</body>
</html>
